agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.
  instance_template: |
    Please solve this issue: {{task}}

    You can execute bash commands and edit files to implement the necessary changes.

    ## Recommended Workflow
    1. Analyze the codebase by finding and reading relevant files
    2. Reproduce the issue
    3. Edit the source code
    4. Verify the fix
    5. Test edge cases
    6. Finish with `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`

    Every response must include at least one bash tool call.
  step_limit: 0
  cost_limit: 3.0
  mode: confirm
  whitelist_actions: []
  confirm_exit: true

environment:
  environment_class: local
  cwd: null
  timeout_secs: 30
  image: null

model:
  model_name: gpt-4.1-mini
  model_class: openai_compatible
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.2
  observation_template: |
    {"returncode": {{ output.returncode }}, "output": {{ output.output | tojson }}, "exception_info": {{ output.exception_info | tojson }}}
  format_error_template: "{{ error }}"
  cost_tracking: default
  multimodal_regex: ""

run:
  task: null
  env_startup_command: null
