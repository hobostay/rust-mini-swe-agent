agent:
  system_template: "You are a helpful assistant that can interact with a computer."
  instance_template: |
    Please solve this issue: {{task}}

    You can execute bash commands and edit files to implement the necessary changes.
    Every response must include at least one bash tool call.
    When you are fully done, run exactly: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
  step_limit: 0
  cost_limit: 3.0
  mode: "confirm"
  whitelist_actions: []
  confirm_exit: true
  output_path: "./last_run.traj.json"

environment:
  environment_class: "local"
  cwd: "."
  timeout_secs: 30
  image: null
  image_tag: null
  interpreter: ["bash", "-lc"]
  env: {}
  forward_env: []
  cwd_auto_create: true
  import_username: null
  import_password: null
  contree_config: {}
  sandbox_build_retries: 3
  global_args: ["--quiet"]
  exec_args: ["--contain", "--cleanenv", "--fakeroot"]

model:
  model_name: "gpt-4.1-mini"
  model_class: "openai_compatible"
  base_url: "https://api.openai.com/v1"
  api_key_env: "OPENAI_API_KEY"
  temperature: 0.2
  provider: null
  set_cache_control: null
  cost_tracking: "default"
  litellm_model_name_override: null
  multimodal_regex: ""
  observation_template: |
    {"returncode": {{ output.returncode }}, "output": {{ output.output | tojson }}, "exception_info": {{ output.exception_info | tojson }}}
  format_error_template: "{{ error }}"

run:
  task: null
  env_startup_command: null
