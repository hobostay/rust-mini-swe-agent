name: Bug report
description: Report a bug or behavioral regression
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce the issue locally.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact commands, config, and input used to trigger the bug.
      placeholder: |
        1. Run `cargo run -- mini ...`
        2. Use config `...`
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead? Include relevant output or screenshots.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Paste the relevant YAML or CLI arguments.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs or trajectory snippet
      description: Paste any useful stderr, backtrace, or `.traj.json` excerpt.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: commit SHA / branch / release tag
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 / Ubuntu 24.04 / Rust 1.93 / provider / environment class

