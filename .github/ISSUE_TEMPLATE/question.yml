name: Question
description: Ask a usage or design question
title: "[Question] "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: What are you trying to understand or decide?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include commands, config, providers, or environment details if relevant.
      placeholder: I am using `bench` with `contree` and `openrouter_response` ...

